<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - Perpustakaan Universitas</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/prototype-bar.css">
</head>
<body class="auth-page">

  <div class="auth-card-container">
    <div class="auth-grid">
      <!-- Form Column -->
      <div class="auth-form-side">
        <h1 class="auth-title">Log in</h1>

        <form id="loginForm" onsubmit="handleLoginSubmit(event)">
          <div class="form-group">
            <label class="form-label" for="usernameOrEmail">Username or Email</label>
            <input 
              type="text" 
              id="usernameOrEmail" 
              class="form-control" 
              placeholder="Masukkan nama pengguna atau alamat email Anda" 
              required
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input 
              type="password" 
              id="password" 
              class="form-control" 
              placeholder="Masukkan kata sandi Anda" 
              required
            >
          </div>

          <button type="submit" class="btn-auth-submit">Log In</button>

          <div class="auth-links">
            <a href="forgot-password.html">Lupa kata sandi?</a>
            <a href="signup-role.html">Sign Up?</a>
          </div>

          <!-- Quick Prototype Helper Pill -->
          <div style="margin-top: 24px; padding: 10px 14px; background: rgba(0,0,0,0.04); border-radius: 8px; font-size: 11px; color: #475569; text-align: center;">
            💡 <strong>Info Login Demo:</strong> Masukkan <em>"admin"</em> untuk masuk ke Admin Dashboard, atau langsung klik Log In untuk Mahasiswa Dashboard.
          </div>
        </form>
      </div>

      <!-- Illustration Column -->
      <div class="auth-illustration-side">
        <img src="assets/images/login-illustration.png" alt="Mari Menjelajah Dengan Buku - Temukan Kebahagiaan Membaca">
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    async function handleLoginSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('usernameOrEmail').value.trim();
      const pass = document.getElementById('password').value.trim();

      // Coba autentikasi via Server Backend Java
      if (window.LibraryAPI) {
        const res = await window.LibraryAPI.login(input, pass);
        if (res && res.success) {
          const user = res.user;
          const role = (user && user.peran) ? user.peran.toLowerCase() : (input.toLowerCase().includes('admin') ? 'admin' : 'mahasiswa');
          localStorage.setItem('lib_role', role);
          if (role === 'admin') {
            AppState.currentUser.admin.name = user.nama || 'Javier Ferdinand';
          } else {
            AppState.currentUser.mahasiswa.name = user.nama || 'Javier';
            AppState.currentUser.mahasiswa.id = user.nim ? `NIM ${user.nim}` : 'NIM 2310511024';
          }
          saveState();
          showToast(res.message || 'Login berhasil!', 'success');
          setTimeout(() => {
            window.location.href = role === 'admin' ? 'admin-dashboard.html' : 'mahasiswa-dashboard.html';
          }, 600);
          return;
        }
      }

      // Fallback jika server offline
      const lower = input.toLowerCase();
      if (lower.includes('admin')) {
        localStorage.setItem('lib_role', 'admin');
        showToast('Login berhasil sebagai Admin!', 'success');
        setTimeout(() => {
          window.location.href = 'admin-dashboard.html';
        }, 600);
      } else {
        localStorage.setItem('lib_role', 'mahasiswa');
        showToast('Login berhasil sebagai Mahasiswa!', 'success');
        setTimeout(() => {
          window.location.href = 'mahasiswa-dashboard.html';
        }, 600);
      }
    }
  </script>
</body>
</html>
