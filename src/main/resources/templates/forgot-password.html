<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ganti Kata Sandi - Perpustakaan Universitas</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/prototype-bar.css">
</head>
<body class="auth-page">

  <div class="auth-card-container">
    <div class="auth-grid">
      <!-- Form Column -->
      <div class="auth-form-side">
        <h1 class="auth-title">Ganti kata sandi</h1>

        <form id="forgotPassForm" onsubmit="handleForgotSubmit(event)">
          <div class="form-group">
            <label class="form-label" for="resetUser">Username or Email</label>
            <input 
              type="text" 
              id="resetUser" 
              class="form-control" 
              placeholder="Masukkan nama pengguna atau alamat email Anda" 
              required
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="resetPhone">Nomor Telepon</label>
            <input 
              type="tel" 
              id="resetPhone" 
              class="form-control" 
              placeholder="Masukkan nomor telepon Anda" 
              required
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="newPassword">Masukkan kata sandi baru</label>
            <input 
              type="password" 
              id="newPassword" 
              class="form-control" 
              placeholder="Masukkan kata sandi" 
              required
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">Konfirmasi kata sandi baru</label>
            <input 
              type="password" 
              id="confirmPassword" 
              class="form-control" 
              placeholder="Masukkan kata sandi" 
              required
            >
          </div>

          <button type="submit" class="btn-auth-submit">Continue</button>

          <div class="auth-links">
            <a href="login.html">Kembali ke Log in</a>
          </div>
        </form>
      </div>

      <!-- Illustration Column -->
      <div class="auth-illustration-side">
        <img src="assets/images/login-illustration.png" alt="Mari Menjelajah Dengan Buku">
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    async function handleForgotSubmit(e) {
      e.preventDefault();
      const user = document.getElementById('resetUser').value.trim();
      const p1 = document.getElementById('newPassword').value;
      const p2 = document.getElementById('confirmPassword').value;
      if (p1 !== p2) {
        showToast('Konfirmasi kata sandi tidak cocok!', 'danger');
        return;
      }

      if (window.LibraryAPI) {
        const res = await window.LibraryAPI.forgotPassword(user, p1);
        if (res && res.success) {
          showToast(res.message || 'Kata sandi berhasil diperbarui!', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1000);
          return;
        }
      }

      showToast('Kata sandi berhasil diperbarui! Mengalihkan ke login...', 'success');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1000);
    }
  </script>
</body>
</html>
