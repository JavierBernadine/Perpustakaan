<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head th:replace="~{fragments/layout :: head('Masuk')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="mb-3 text-center">Masuk</h4>
 
                    <div class="alert alert-danger" th:if="${param.error}">
                        Login gagal. Periksa kembali username/NIM dan password Anda, atau hubungi Admin perpustakaan.
                    </div>
                    <div class="alert alert-success" th:if="${param.logout}">
                        Anda telah keluar dari sistem.
                    </div>
 
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="username">Username / NIM</label>
                            <input type="text" class="form-control" id="username" name="username" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Masuk</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: skrip}"></th:block>
</body>
</html>
