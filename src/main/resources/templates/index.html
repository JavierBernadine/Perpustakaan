<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beranda - Perpustakaan Universitas</title>
   <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/auth.css}">
  <link rel="stylesheet" th:href="@{/css/prototype-bar.css}">
</head>
<body class="landing-body">

  <!-- Header -->
  <header class="landing-header">
    <div class="landing-logo">
      <svg viewBox="0 0 24 24">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
      <div class="landing-logo-text">
        <h2>Perpustakaan Universitas</h2>
        <p>Ilmu Hari Ini, Masa Depan Nanti</p>
      </div>
    </div>
    
    <a th:href="@{/login}" class="btn-landing-login">Login</a>
  </header>

  <!-- Hero Content -->
  <main class="landing-hero">
    <h1>
      Selamat Datang di
      <strong>Perpustakaan</strong>
    </h1>
    <p class="landing-hero-desc">
      Temukan buku, jelajahi pengetahuan, dan wujudkan masa depan yang lebih baik.
    </p>
  </main>

  <!-- Features Footer -->
  <footer class="landing-features-row">
    <!-- Feature 1 -->
    <div class="landing-feature-col">
      <svg viewBox="0 0 24 24">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
      <div class="feature-info">
        <h4>Koleksi Lengkap</h4>
        <p>Buku, jurnal, e-book</p>
      </div>
    </div>

    <!-- Feature 2 -->
    <div class="landing-feature-col">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      <div class="feature-info">
        <h4>Akses Mudah</h4>
        <p>Online & Offline</p>
      </div>
    </div>

    <!-- Feature 3 -->
    <div class="landing-feature-col">
      <svg viewBox="0 0 24 24">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <div class="feature-info">
        <h4>Ramah Pengguna</h4>
        <p>Untuk seluruh civitas</p>
      </div>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
