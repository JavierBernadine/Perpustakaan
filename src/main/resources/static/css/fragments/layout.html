<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">

<head th:fragment="head(judul)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${judul} + ' | Perpustakaan Universitas'">Perpustakaan Universitas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style1.css}">
</head>

<body>

    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">Perpustakaan Universitas</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuUtama"
                aria-controls="menuUtama" aria-expanded="false" aria-label="Buka menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuUtama">
                <ul class="navbar-nav me-auto" th:if="${penggunaLogin != null}">
                    <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/katalog}">Katalog</a></li>
                    <th:block th:if="${adalahAdmin}">
                        <li class="nav-item"><a class="nav-link" th:href="@{/admin/buku}">Data Buku</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/admin/anggota}">Data Anggota</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/admin/peminjaman}">Sirkulasi</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/admin/riwayat}">Riwayat</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/admin/denda}">Denda</a></li>
                    </th:block>
                    <th:block th:if="${adalahMahasiswa}">
                        <li class="nav-item"><a class="nav-link" th:href="@{/mahasiswa/riwayat}">Riwayat</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/mahasiswa/denda}">Denda</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/mahasiswa/favorit}">Favorit</a></li>
                    </th:block>
                </ul>
                <div class="ms-auto d-flex align-items-center gap-2" th:if="${penggunaLogin != null}">
                    <a class="btn btn-sm btn-outline-light" th:href="@{/profil}"
                        th:text="${penggunaLogin.namaLengkap}">Nama</a>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-sm btn-light">Keluar</button>
                    </form>
                </div>
                <a th:if="${penggunaLogin == null}" class="btn btn-sm btn-light ms-auto" th:href="@{/login}">Masuk</a>
            </div>
        </div>
    </nav>

    <div th:fragment="alerts">
        <div th:if="${sukses}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${sukses}">Berhasil</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Tutup"></button>
        </div>
        <div th:if="${galat}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${galat}">Gagal</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Tutup"></button>
        </div>
    </div>

    <span th:fragment="badgeStatus(s)" class="badge"
        th:classappend="${s.name() == 'DIPINJAM'} ? 'text-bg-primary' : (${s.name() == 'DIAJUKAN'} ? 'text-bg-warning' : (${s.name() == 'DITOLAK'} ? 'text-bg-danger' : 'text-bg-success'))"
        th:text="${s.label}">Status</span>

    <span th:fragment="badgeDenda(s)" class="badge"
        th:classappend="${s.name() == 'LUNAS'} ? 'text-bg-success' : 'text-bg-danger'"
        th:text="${s.label}">Status</span>

    <footer th:fragment="footer" class="container text-center py-4 mt-4">
        Website Manajemen Perpustakaan Universitas &copy; 2026
    </footer>

    <th:block th:fragment="skrip">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/app.js}"></script>
    </th:block>

</body>

</html>
